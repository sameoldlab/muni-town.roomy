name: 'Build and release tauri'

on:
  workflow_dispatch:
    inputs:
      ios_only:
        description: 'Run only the iOS TestFlight job (skip the desktop/android release)'
        type: boolean
        default: true
  push:
    tags:
      - 'v*' # Should match `version` in ./src-tauri/tauri.conf.json

jobs:
  publish-tauri:
    # A manual dispatch runs EVERY job in the workflow, and this job rejects a
    # non-tag ref outright: it derives the expected version from
    # `${GITHUB_REF#refs/tags/v}`, which on a branch evaluates to the branch
    # name and fails the tag/version assertion. So the release job is entered
    # only on a tag push, or on a manual run that opts out of `ios_only`.
    if: ${{ github.event_name == 'push' || !inputs.ios_only }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-latest'
            android: yes
          - platform: 'ubuntu-latest'
          - platform: 'windows-latest'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Get app version
        shell: bash
        run: echo "APP_VERSION=$(jq -r .version packages/app-lite/src-tauri/tauri.conf.json)" >> $GITHUB_ENV

      - name: Validate app version matches tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: tauri.conf.json=$APP_VERSION, tag=$TAG_VERSION"
            exit 1
          fi
          echo "Version $APP_VERSION validated"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '.packages/app-lite/src-tauri -> target'

      - name: Generate Build Assets
        run: |
          pnpm install
          pnpm -w add @tauri-apps/cli@2.11
          pnpm turbo run build-lib
          cd ./packages/app-lite
          pnpm tauri icon ./src-tauri/icon.manifest.json 
          pnpm build

      - name: Init android
        if: ${{ matrix.android }}
        run: |
          cd ./packages/app-lite
          pnpm tauri android init
          # run generate icons again to overwrite default tauri icon
          pnpm tauri icon ./src-tauri/icon.manifest.json
          ./scripts/copy-android-assets.sh
          cd ./src-tauri/gen/android
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          # generate keystore.jks locally and add to secrets with `base64 -i keystore.jks`
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > $RUNNER_TEMP/keystore.jks
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      - name: Setup java
        uses: actions/setup-java@v5
        if: ${{ matrix.android }}
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup NDK 
        uses: nttld/setup-ndk@v1
        if: ${{ matrix.android }}
        id: setup-ndk
        with:
          ndk-version: r26d
          local-cache: false
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Build Android
        if: ${{ matrix.android }}
        run: |
          cd ./packages/app-lite
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          pnpm tauri android build --apk
          cp ./src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk ./src-tauri/gen/android/app/build/outputs/apk/universal/release/roomy-chat_${{ env.APP_VERSION}}.apk
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      # Could use this for everything if it gets more complicated
      - name: Release Android
        uses: softprops/action-gh-release@v3
        if: ${{ matrix.android }}
        with:
          draft: false
          files: |
            ${{ github.workspace }}/packages/app-lite/src-tauri/gen/android/app/build/outputs/apk/universal/release/roomy-chat_*.apk
          append_body: true
          prerelease: true
          name: ${{ env.APP_VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: tauri-apps/tauri-action@v0
        if: ${{ !matrix.android }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'v__VERSION__'
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # ── iOS → TestFlight ───────────────────────────────────────────────────────
  # Separate from the matrix above: it needs a macOS runner with Xcode, an
  # Apple Developer account's signing assets, and it uploads to App Store
  # Connect rather than creating a GitHub release.
  #
  # `tauri ios build` archives and exports an IPA but does NOT upload it, so
  # the upload is an explicit `altool` step.
  #
  # Required secrets:
  #   APPLE_CERTIFICATE            base64 of the .p12 distribution certificate
  #                                (`base64 -i cert.p12 | pbcopy`)
  #   APPLE_CERTIFICATE_PASSWORD   password chosen when exporting the .p12
  #   APPLE_SIGNING_IDENTITY       e.g. "Apple Distribution: Name (TEAMID)"
  #   APPLE_API_KEY                App Store Connect API key ID
  #   APPLE_API_ISSUER             App Store Connect API issuer ID (UUID)
  #   APPLE_API_KEY_P8_BASE64      base64 of the AuthKey_<KEYID>.p8 file
  #
  # `APPLE_DEVELOPMENT_TEAM` is intentionally not required: `bundle > iOS >
  # developmentTeam` in tauri.conf.json is left unset so local builds don't
  # bake in a team, and this job passes the team ID through the environment.
  publish-ios:
    name: iOS TestFlight
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Get app version
        shell: bash
        run: echo "APP_VERSION=$(jq -r .version packages/app-lite/src-tauri/tauri.conf.json)" >> $GITHUB_ENV

      - name: Pin Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '.packages/app-lite/src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK (app-lite imports its dist)
        run: pnpm turbo run build-lib

      - name: Build frontend
        run: pnpm --filter app-lite build

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          CERT="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT"
          security import "$CERT" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Let codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # ── Assert the secret really holds an Apple-issued identity ──────
          # A wrong APPLE_CERTIFICATE is otherwise only discovered ~20 minutes
          # later, inside Xcode's exportArchive, as "Cloud signing permission
          # error" + "No profiles for '<bundle id>' were found" — which reads
          # like a provisioning problem rather than a bad input.
          #
          # Two properties separate an Apple-issued cert from a locally
          # generated one. Both are required:
          #   1. an organizationalUnit — Apple always sets OU to the Team ID.
          #      cargo-mobile2 prints a cert lacking one as "(unset)", and
          #      xcodebuild refuses to Cloud-sign with it.
          #   2. Apple's WWDR intermediate issues it.
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -oE '"Apple (Distribution|Development)[^"]*"' | head -n 1)"
          if [ -z "$IDENTITY" ]; then
            echo "::error::APPLE_CERTIFICATE does not contain a usable 'Apple Distribution' identity."
            echo "--- identities in the imported keychain:"
            security find-identity -p codesigning "$KEYCHAIN" || true
            # Inspect via the keychain rather than re-opening the p12: the PEM
            # is readable without the password once imported, whereas
            # `openssl pkcs12` needs the right one and would print a second,
            # misleading "Mac verify error: invalid password?" here.
            echo "--- certificates in the imported keychain (subject / issuer):"
            security find-certificate -a -p "$KEYCHAIN" 2>/dev/null \
              | openssl crl2pkcs7 -nocrl -certfile /dev/stdin 2>/dev/null \
              | openssl pkcs7 -print_certs -noout 2>/dev/null \
              | grep -E "^subject|^issuer" || true
            echo "--- password check:"
            if openssl pkcs12 -in "$CERT" -nokeys -passin "pass:$APPLE_CERTIFICATE_PASSWORD" -legacy >/dev/null 2>&1; then
              echo "APPLE_CERTIFICATE_PASSWORD is correct for this p12."
            else
              echo "APPLE_CERTIFICATE_PASSWORD does NOT match this p12"
              echo "(openssl reports 'Mac verify error: invalid password?')."
            fi
            echo "Expected: subject O=<your name> and OU=<your Team ID>, issued by"
            echo "'Apple Worldwide Developer Relations Certification Authority'."
            echo "A cert with O=Tauri, or with no OU at all, is not from your account."
            exit 1
          fi
          echo "Imported identity: $IDENTITY"
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ] && ! grep -qF "$APPLE_SIGNING_IDENTITY" <<<"$IDENTITY"; then
            echo "::error::APPLE_SIGNING_IDENTITY ($APPLE_SIGNING_IDENTITY) does not match the certificate ($IDENTITY)."
            exit 1
          fi
          rm -f "$CERT"

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          # altool discovers `AuthKey_<KEYID>.p8` under $API_PRIVATE_KEYS_DIR.
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          echo "API_PRIVATE_KEYS_DIR=$RUNNER_TEMP/private_keys" >> $GITHUB_ENV

      - name: Init iOS project
        env:
          # `ios build --build-number` is inert (verified on 2.12.0: it leaves
          # CFBundleVersion at the config default). The bundle version must be
          # set through the config at `ios init`, which regenerates the Xcode
          # project's CFBundleVersion. App Store Connect rejects an upload that
          # reuses a build number, so this must be unique per run.
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cd ./packages/app-lite
          pnpm dlx @tauri-apps/cli@2.12.0 ios init --ci \
            -c "{\"bundle\":{\"iOS\":{\"bundleVersion\":\"$BUILD_NUMBER\"}}}"
          grep -q "CFBundleVersion: \"$BUILD_NUMBER\"" src-tauri/gen/apple/project.yml \
            || { echo "::error::CFBundleVersion was not set to $BUILD_NUMBER"; exit 1; }
          # The generated Xcode build phase is emitted with an UNPINNED
          # `pnpm dlx @tauri-apps/cli ios xcode-script`. Pin it to the same CLI
          # this job drives: the options-server handshake between the two
          # changed location in 2.12.0, so a driver/script version skew fails
          # the build with a spurious "cli-options-server.json" error.
          files="$(grep -rl 'pnpm dlx @tauri-apps/cli ' src-tauri/gen/apple)"
          if [ -z "$files" ]; then
            echo "::error::No generated file references the CLI; ios init output changed."
            exit 1
          fi
          printf '%s\n' "$files" | tr '\n' '\0' | xargs -0 sed -i '' 's|pnpm dlx @tauri-apps/cli |pnpm dlx @tauri-apps/cli@2.12.0 |g'
          # Fail loudly rather than shipping an unpinned driver/script pair.
          if grep -rq 'pnpm dlx @tauri-apps/cli ' src-tauri/gen/apple; then
            echo "::error::Failed to pin the generated xcode-script invocation."
            exit 1
          fi
          echo "Pinned xcode-script to the driver CLI."

      - name: Build iOS archive and IPA
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          cd ./packages/app-lite
          # Deliberately NO APPLE_API_KEY / APPLE_API_ISSUER /
          # APPLE_API_KEY_PATH here. Supplying all three makes the CLI treat
          # the build as "credentials present" and set `skip_codesign`
          # (tauri-cli src/mobile/ios/build.rs:
          #     let skip_signing = options.no_sign || credentials.is_some();
          #     if skip_signing { build_config = build_config.skip_codesign(); }
          # ), after which it force-signs the app with a throwaway
          # self-signed certificate generated with
          #     team_id: "unset", person_name: "Tauri"
          # — i.e. exactly the
          #     found cert "Apple Distribution: Tauri (unset)" with organization "Tauri"
          # line and the subsequent "Cloud signing permission error". That
          # cert is a Tauri artefact, not anything from APPLE_CERTIFICATE.
          #
          # With no API key in the environment the CLI does a real build and
          # signs with the imported distribution identity. The API key is used
          # only by the `altool` upload below, which is all it is for.
          pnpm dlx @tauri-apps/cli@2.12.0 ios build \
            --target aarch64 \
            --export-method release-testing
          # Surface what was produced so a failure downstream is unambiguous.
          find src-tauri/gen/apple/build -name '*.ipa' -o -name '*.xcarchive' | sort

      - name: Upload to TestFlight
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          IPA="$(find packages/app-lite/src-tauri/gen/apple/build -name '*.ipa' | head -n 1)"
          if [ -z "$IPA" ]; then
            echo "::error::No .ipa produced — check the archive step above."
            exit 1
          fi
          echo "Uploading $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --api-key "$APPLE_API_KEY" \
            --api-issuer "$APPLE_API_ISSUER" \
            --verbose

