name: 'Build and release tauri'

on:
  workflow_dispatch:
    inputs:
      ios_only:
        description: 'Run only the iOS TestFlight job (skip the desktop/android release)'
        type: boolean
        default: true
  push:
    tags:
      - 'v*' # Should match `version` in ./src-tauri/tauri.conf.json

jobs:
  publish-tauri:
    # A manual dispatch runs EVERY job in the workflow, and this job rejects a
    # non-tag ref outright: it derives the expected version from
    # `${GITHUB_REF#refs/tags/v}`, which on a branch evaluates to the branch
    # name and fails the tag/version assertion. So the release job is entered
    # only on a tag push, or on a manual run that opts out of `ios_only`.
    if: ${{ github.event_name == 'push' || !inputs.ios_only }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-latest'
            android: yes
          - platform: 'ubuntu-latest'
          - platform: 'windows-latest'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Get app version
        shell: bash
        run: echo "APP_VERSION=$(jq -r .version packages/app-lite/src-tauri/tauri.conf.json)" >> $GITHUB_ENV

      - name: Validate app version matches tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: tauri.conf.json=$APP_VERSION, tag=$TAG_VERSION"
            exit 1
          fi
          echo "Version $APP_VERSION validated"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '.packages/app-lite/src-tauri -> target'

      - name: Generate Build Assets
        run: |
          pnpm install
          pnpm -w add @tauri-apps/cli@2.11
          pnpm turbo run build-lib
          cd ./packages/app-lite
          pnpm tauri icon ./src-tauri/icon.manifest.json 
          pnpm build

      - name: Init android
        if: ${{ matrix.android }}
        run: |
          cd ./packages/app-lite
          pnpm tauri android init
          # run generate icons again to overwrite default tauri icon
          pnpm tauri icon ./src-tauri/icon.manifest.json
          ./scripts/copy-android-assets.sh
          cd ./src-tauri/gen/android
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          # generate keystore.jks locally and add to secrets with `base64 -i keystore.jks`
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > $RUNNER_TEMP/keystore.jks
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      - name: Setup java
        uses: actions/setup-java@v5
        if: ${{ matrix.android }}
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup NDK 
        uses: nttld/setup-ndk@v1
        if: ${{ matrix.android }}
        id: setup-ndk
        with:
          ndk-version: r26d
          local-cache: false
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Build Android
        if: ${{ matrix.android }}
        run: |
          cd ./packages/app-lite
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          pnpm tauri android build --apk
          cp ./src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk ./src-tauri/gen/android/app/build/outputs/apk/universal/release/roomy-chat_${{ env.APP_VERSION}}.apk
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      # Could use this for everything if it gets more complicated
      - name: Release Android
        uses: softprops/action-gh-release@v3
        if: ${{ matrix.android }}
        with:
          draft: false
          files: |
            ${{ github.workspace }}/packages/app-lite/src-tauri/gen/android/app/build/outputs/apk/universal/release/roomy-chat_*.apk
          append_body: true
          prerelease: true
          name: ${{ env.APP_VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: tauri-apps/tauri-action@v0
        if: ${{ !matrix.android }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'v__VERSION__'
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # ── iOS → TestFlight ───────────────────────────────────────────────────────
  # Separate from the matrix above: it needs a macOS runner with Xcode, an
  # Apple Developer account's signing assets, and it uploads to App Store
  # Connect rather than creating a GitHub release.
  #
  # `tauri ios build` archives and exports an IPA but does NOT upload it, so
  # the upload is an explicit `altool` step.
  #
  # Required secrets:
  #   APPLE_CERTIFICATE            base64 of the .p12 distribution certificate
  #                                (`base64 -i cert.p12 | pbcopy`)
  #   APPLE_CERTIFICATE_PASSWORD   password chosen when exporting the .p12
  #   APPLE_SIGNING_IDENTITY       e.g. "Apple Distribution: Name (TEAMID)"
  #   APPLE_API_KEY                App Store Connect API key ID
  #   APPLE_API_ISSUER             App Store Connect API issuer ID (UUID)
  #   APPLE_API_KEY_P8_BASE64      base64 of the AuthKey_<KEYID>.p8 file
  #
  # `APPLE_DEVELOPMENT_TEAM` is intentionally not required: `bundle > iOS >
  # developmentTeam` in tauri.conf.json is left unset so local builds don't
  # bake in a team, and this job passes the team ID through the environment.
  publish-ios:
    name: iOS TestFlight
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Get app version
        shell: bash
        run: echo "APP_VERSION=$(jq -r .version packages/app-lite/src-tauri/tauri.conf.json)" >> $GITHUB_ENV

      - name: Pin Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '.packages/app-lite/src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK (app-lite imports its dist)
        run: pnpm turbo run build-lib

      - name: Build frontend
        run: pnpm --filter app-lite build

      # ── Verify the certificate the iOS path will actually use ─────────────
      #
      # `tauri ios build` reads IOS_CERTIFICATE / IOS_CERTIFICATE_PASSWORD /
      # IOS_MOBILE_PROVISION -- NOT the APPLE_* names, which belong to the
      # macOS bundler. APPLE_CERTIFICATE appears nowhere in the iOS source
      # (crates/tauri-cli/src/mobile/ios/{build,mod}.rs), so a secret named
      # APPLE_CERTIFICATE is silently ignored and the build signs with the
      # CLI's throwaway self-signed cert
      # ("Apple Distribution: Tauri (unset)"), then fails at export with
      # "Cloud signing permission error" + "No profiles for '<id>'".
      #
      # The secrets keep their APPLE_* names; this step maps them onto the
      # IOS_* variables the toolchain reads.
      #
      # `ios build` collects every identity in the p12 into a BTreeSet and
      # takes `.first()` (tauri-macos-sign/src/keychain/identity.rs), ordering
      # on (organization, common name, ...). A p12 holding BOTH an Apple
      # Development and an Apple Distribution cert therefore resolves to
      # Development, which cannot sign a TestFlight build. So this asserts a
      # Distribution identity exists and that no Development one is present
      # alongside it.
      - name: Verify signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT"
          if [ ! -s "$CERT" ]; then
            echo "::error::APPLE_CERTIFICATE decoded to an empty file."
            exit 1
          fi

          # `-info` prints every cert's subject; piping to a single `openssl
          # x509 -noout` would report only the FIRST cert, hiding the others.
          # `-nomacver` is used only to list subjects after a password failure,
          # so a wrong password still shows what is actually in the file.
          if openssl pkcs12 -in "$CERT" -nokeys -passin "pass:$APPLE_CERTIFICATE_PASSWORD" -legacy >/dev/null 2>&1; then
            SUBJECTS="$(openssl pkcs12 -in "$CERT" -nokeys -passin "pass:$APPLE_CERTIFICATE_PASSWORD" -legacy -info 2>&1 | grep -E '^subject=' || true)"
          elif openssl pkcs12 -in "$CERT" -nokeys -passin "pass:$APPLE_CERTIFICATE_PASSWORD" >/dev/null 2>&1; then
            SUBJECTS="$(openssl pkcs12 -in "$CERT" -nokeys -passin "pass:$APPLE_CERTIFICATE_PASSWORD" -info 2>&1 | grep -E '^subject=' || true)"
          else
            echo "::error::APPLE_CERTIFICATE_PASSWORD does not match APPLE_CERTIFICATE."
            echo "openssl reports 'Mac verify error: invalid password?' for this pairing."
            echo "--- certs present anyway (subjects):"
            openssl pkcs12 -in "$CERT" -nokeys -nomacver -legacy -info 2>&1 | grep -E '^subject=' || echo "(unreadable)"
            exit 1
          fi

          echo "--- certificates in the p12:"
          echo "$SUBJECTS"

          if ! grep -q "Apple Distribution" <<<"$SUBJECTS"; then
            echo "::error::APPLE_CERTIFICATE contains no 'Apple Distribution' certificate."
            echo "Export it from Keychain Access > My Certificates >"
            echo "'Apple Distribution: ...' (that view is what includes the key)."
            exit 1
          fi
          if grep -q "Apple Development\|Apple Developer\|CN=localhost" <<<"$SUBJECTS"; then
            echo "::error::APPLE_CERTIFICATE also contains a non-distribution certificate."
            echo "The iOS toolchain sorts every identity in the p12 and takes the FIRST"
            echo "(tauri-macos-sign keychain/identity.rs: BTreeSet over"
            echo " (organization, common name, ...)), so a Development cert makes it"
            echo "sign with the wrong identity and export fails."
            echo "Export the Apple Distribution identity ALONE."
            exit 1
          fi
          echo "Certificate OK: exactly one Apple Distribution identity."

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          # altool discovers `AuthKey_<KEYID>.p8` under $API_PRIVATE_KEYS_DIR.
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          echo "API_PRIVATE_KEYS_DIR=$RUNNER_TEMP/private_keys" >> $GITHUB_ENV

      - name: Init iOS project
        env:
          # `ios build` never reads APPLE_DEVELOPMENT_TEAM (it does not appear
          # in the CLI's ios build source at all — the only team id it knows is
          # the throwaway "unset" for its dummy cert). The team reaches
          # xcodebuild solely through the generated Xcode project's
          # DEVELOPMENT_TEAM, so it must be set at `ios init`, which is what
          # renders it from `bundle > iOS > developmentTeam` / this env var.
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          # The IOS_* names, because that is what the iOS toolchain reads.
          IOS_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.APPLE_MOBILE_PROVISION }}
          # `ios build` runs cargo-mobile2, which calls
          # `agvtool new-version -all <version>` to stamp the build. agvtool
          # writes CURRENT_PROJECT_VERSION and CFBundleVersion, and refuses to
          # work unless the target has a versioning system configured — it
          # reports "There does not seem to be a CURRENT_PROJECT_VERSION key
          # set for this project" otherwise. The XcodeGen template sets
          # neither, so the version must be applied here, after `ios init`.
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          # The IOS_* names, because that is what the iOS toolchain reads.
          IOS_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.APPLE_MOBILE_PROVISION }}
          # App Store Connect rejects an upload that reuses a build number, so
          # it must change every run. `github.run_number` is monotonic per
          # workflow, which is what makes it safe here.
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cd ./packages/app-lite
          pnpm dlx @tauri-apps/cli@2.12.0 ios init --ci
          PROJ=src-tauri/gen/apple/app.xcodeproj/project.pbxproj

          # Assert the team actually landed in the project; without it the
          # build cannot sign and the failure surfaces much later.
          grep -q "DEVELOPMENT_TEAM = ${APPLE_DEVELOPMENT_TEAM}" "$PROJ" \
            || { echo "::error::DEVELOPMENT_TEAM was not set to ${APPLE_DEVELOPMENT_TEAM}"; exit 1; }

          # ── Build number ─────────────────────────────────────────────────
          # xcodebuild's -exportArchive defaults to
          # manageAppVersionAndBuildNumber=YES, i.e. Xcode rewrites the build
          # number itself at export time (observed: "Setting version of
          # project app to: 1. / Updated CFBundleVersion ... to 1"), which
          # would clobber ours and make every upload collide on build 1.
          # Setting it to NO in the generated ExportOptions.plist makes Xcode
          # keep the CFBundleVersion we set. `ios init` writes that file and
          # `ios build` merges it with its own generated options, so a key it
          # does not itself emit (it emits only method/signingStyle/
          # signingCertificate/provisioningProfiles/teamID) survives.
          plutil -replace manageAppVersionAndBuildNumber -bool NO \
            src-tauri/gen/apple/ExportOptions.plist \
            || plutil -insert manageAppVersionAndBuildNumber -bool NO \
                 src-tauri/gen/apple/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Print :manageAppVersionAndBuildNumber" \
            src-tauri/gen/apple/ExportOptions.plist | grep -qx false \
            || { echo "::error::manageAppVersionAndBuildNumber is not false"; exit 1; }

          # Stamp the version the way cargo-mobile2 does. `agvtool
          # new-version` writes CFBundleVersion into Info.plist (the file
          # INFOPLIST_FILE points at, so it is what ships) but its read-back
          # of CURRENT_PROJECT_VERSION fails on this XcodeGen project —
          # "There does not seem to be a CURRENT_PROJECT_VERSION key set for
          # this project" — because the template configures no versioning
          # system. The write still lands, so the exit status is ignored and
          # the result is asserted from Info.plist instead of trusting the
          # tool's own report.
          ( cd src-tauri/gen/apple && xcrun agvtool new-version -all "$BUILD_NUMBER" >/dev/null 2>&1 || true )
          got="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' src-tauri/gen/apple/app_iOS/Info.plist)"
          [ "$got" = "$BUILD_NUMBER" ] \
            || { echo "::error::CFBundleVersion is '$got', expected '$BUILD_NUMBER'"; exit 1; }
          echo "Build number ${BUILD_NUMBER} stamped."

          # The generated Xcode build phase is emitted with an UNPINNED
          # `pnpm dlx @tauri-apps/cli ios xcode-script`. Pin it to the same CLI
          # this job drives: the options-server handshake between the two
          # changed location in 2.12.0, so a driver/script version skew fails
          # the build with a spurious "cli-options-server.json" error.
          files="$(grep -rl 'pnpm dlx @tauri-apps/cli ' src-tauri/gen/apple)"
          if [ -z "$files" ]; then
            echo "::error::No generated file references the CLI; ios init output changed."
            exit 1
          fi
          printf '%s\n' "$files" | tr '\n' '\0' | xargs -0 sed -i '' 's|pnpm dlx @tauri-apps/cli |pnpm dlx @tauri-apps/cli@2.12.0 |g'
          # Fail loudly rather than shipping an unpinned driver/script pair.
          if grep -rq 'pnpm dlx @tauri-apps/cli ' src-tauri/gen/apple; then
            echo "::error::Failed to pin the generated xcode-script invocation."
            exit 1
          fi
          echo "Pinned xcode-script to the driver CLI."

      - name: Build iOS archive and IPA
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          # The toolchain reads IOS_* for signing; APPLE_CERTIFICATE is a
          # macOS-bundler name and is ignored on the iOS path. The secrets keep
          # their APPLE_* names and are mapped here.
          IOS_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.APPLE_MOBILE_PROVISION }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          cd ./packages/app-lite
          # With IOS_CERTIFICATE + IOS_MOBILE_PROVISION present the CLI writes
          # CODE_SIGN_STYLE=Manual, CODE_SIGN_IDENTITY, DEVELOPMENT_TEAM and
          # PROVISIONING_PROFILE_SPECIFIER into the project, so export signs
          # against a real profile instead of asking Apple to mint a
          # cloud-managed certificate (which this account refuses:
          # "Cloud signing permission error").
          #
          # The ASC API key is still passed: credentials.is_some() also makes
          # the CLI skip_codesign for build/archive and force-sign with a
          # throwaway self-signed cert ("Apple Distribution: Tauri (unset)"),
          # which is deliberate — it only preserves entitlements until export,
          # which re-signs with the real certificate.
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          if [ ! -f "$APPLE_API_KEY_PATH" ]; then
            echo "::error::API key file missing at $APPLE_API_KEY_PATH"
            exit 1
          fi
          # `app-store-connect` is the App Store / TestFlight export method.
          # NOT `release-testing`: the CLI maps that to Xcode's "ad-hoc"
          # (ExportMethod::pre_xcode_15_4_name:
          #     Self::ReleaseTesting => "ad-hoc".to_string()
          # ), which requires an *Ad Hoc* provisioning profile (device-list
          # based) and fails with
          #     Provisioning profile "..." is not an "iOS Ad Hoc" profile.
          # An App Store distribution profile belongs with app-store-connect.
          pnpm dlx @tauri-apps/cli@2.12.0 ios build \
            --target aarch64 \
            --export-method app-store-connect
          # Surface what was produced so a failure downstream is unambiguous.
          find src-tauri/gen/apple/build -name '*.ipa' -o -name '*.xcarchive' | sort

      - name: Upload to TestFlight
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          IPA="$(find packages/app-lite/src-tauri/gen/apple/build -name '*.ipa' | head -n 1)"
          if [ -z "$IPA" ]; then
            echo "::error::No .ipa produced — check the archive step above."
            exit 1
          fi
          echo "Uploading $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --api-key "$APPLE_API_KEY" \
            --api-issuer "$APPLE_API_ISSUER" \
            --verbose

